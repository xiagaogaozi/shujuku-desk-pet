<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌宠素材预览</title>
<style>
body{margin:24px;background:#eef1f4;color:#202631;font:15px system-ui,sans-serif}h1{font-size:24px}p{line-height:1.7;max-width:850px}.stage{width:200px;height:200px;display:grid;place-items:center;background:repeating-conic-gradient(#d8dce0 0 25%,white 0 50%) 50%/24px 24px;border-radius:12px;overflow:hidden}.body{width:128px;height:128px}.body img{width:100%;height:100%;object-fit:contain;transform-origin:50% 80%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{padding:8px 12px;border:1px solid #aeb7c2;border-radius:7px;background:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.tile img{width:110px;height:110px;object-fit:contain;background:repeating-conic-gradient(#d8dce0 0 25%,white 0 50%) 50%/20px 20px}.tile span{display:block;margin-top:6px}.pose-idle,.pose-snore,.pose-sit-snore{animation:breathe 2.8s ease-in-out infinite}.pose-working,.pose-wave,.pose-happy{animation:sway 1.2s ease-in-out infinite}.pose-struggle{transform-origin:50% 20%!important;animation:sway .42s ease-in-out infinite}.pose-roll{animation:roll .68s linear infinite}.pose-tickle,.pose-angry{animation:sway .2s linear infinite}.pose-dizzy{animation:sway 1.2s ease-in-out infinite}.pose-pound{animation:pound .43s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.02,.98)}}@keyframes sway{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}@keyframes roll{to{transform:rotate(360deg)}}@keyframes pound{50%{transform:scale(1.16) translateY(-4px)}}@media(prefers-reduced-motion:reduce){.body img{animation:none!important}}
</style>
<h1 id="title"></h1><p>离线素材预览：透明底、姿态切换及部分简化动效。不是奶数据库真实运行验收；没有执行换肤，也不连接酒馆。贴边裁切、任务触发和精确节奏请在用户授权后于真实宿主检查。</p>
<div class="stage"><div class="body"><img id="hero" alt="当前桌宠姿态"></div></div><p id="state"></p><div class="controls" id="controls"></div><div class="grid" id="grid"></div>
<script>
const skin = /*__SKIN_CONFIG__*/ null;
document.getElementById('title').textContent = skin.name;
const hero = document.getElementById('hero'), state = document.getElementById('state');
let timer;
function show(key) { hero.src = skin.images[key]; hero.className = `pose-${key}`; state.textContent = key; }
function play(steps) { clearTimeout(timer); let i=0; function tick(){const [key,ms]=steps[i++ % steps.length];show(key);timer=setTimeout(tick,ms);}tick(); }
for (const key of Object.keys(skin.images)) {
  const tile=document.createElement('button');tile.className='tile';const image=document.createElement('img');image.src=skin.images[key];image.alt=key;
  const label=document.createElement('span');label.textContent=key;tile.append(image,label);tile.onclick=()=>{clearTimeout(timer);show(key)};document.getElementById('grid').append(tile);
}
const sequences={
  '眨眼':[['idle',1800],['blink',160]],
  '走路两帧':[['walk-a',230],['walk-b',230]],
  '进食':[['eat-a',900],['eat-b',650],['eat-a',450],['eat-b',900]],
  '生气连段':[['angry',2200],['huff',1000],['pound',1300],['knockdown',2200],['idle',1000]]
};
for (const [label,steps] of Object.entries(sequences)) { if (!steps.every(([key])=>skin.images[key]))continue;const button=document.createElement('button');button.textContent=label;button.onclick=()=>play(steps);document.getElementById('controls').append(button); }
show(skin.images.idle?'idle':Object.keys(skin.images)[0]);
</script></html>
